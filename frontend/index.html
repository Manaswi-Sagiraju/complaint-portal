<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SafeReport Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-option {
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .card-option:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="container text-center">
    <h1 class="mb-5">🛡️ SafeReport Portal</h1>

    <div class="row justify-content-center">

        <!-- Citizen Option -->
        <div class="col-md-4 mb-4">
            <div class="card card-option bg-light text-dark"
                 onclick="window.location.href='final-complaintForm.html'">
                <h3>📝 File a Complaint</h3>
                <p>Report incidents safely and securely.</p>
                <button class="btn btn-primary mt-3">Proceed</button>
            </div>
        </div>

        <!-- Admin Option -->
        <div class="col-md-4 mb-4">
            <div class="card card-option bg-warning text-dark"
                 onclick="window.location.href='admin-login.html'">
                <h3>🔐 Admin Login</h3>
                <p>Access administrator dashboard.</p>
                <button class="btn btn-dark mt-3">Login</button>
            </div>
        </div>

    </div>
</div>

</body>
</html>
