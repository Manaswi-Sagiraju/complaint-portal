<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Complaint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4 text-center">📝 File a Complaint</h3>

        <form id="complaintForm" enctype="multipart/form-data">

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" required></textarea>
            </div>

            <!-- Category -->
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" required>
            </div>

            <!-- Date -->
            <div class="mb-3">
                <label class="form-label">Incident Date</label>
                <input type="datetime-local" name="incident_date" class="form-control" required>
            </div>

            <!-- Location -->
            <div class="mb-3">
                <label class="form-label">Incident Location</label>

                <button type="button"
                        onclick="getLocation()"
                        class="btn btn-sm btn-secondary mb-2">
                    Get Current Location
                </button>

                <input type="text"
                       id="incidentLocation"
                       name="incident_location"
                       class="form-control"
                       required>
            </div>

            <!-- Evidence Files -->
            <div class="mb-3">
                <label class="form-label">Upload Evidence (PDF, Image, Audio)</label>
                <input type="file"
                       name="evidenceFiles"
                       multiple
                       class="form-control">
            </div>

            <!-- Anonymous -->
            <div class="form-check mb-3">
                <input type="checkbox"
                       id="anonymousCheck"
                       name="is_anonymous"
                       value="1"
                       class="form-check-input">
                <label class="form-check-label">
                    Submit Anonymously
                </label>
            </div>

            <!-- User Details -->
            <div id="userDetails">
                <div class="mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text"
                           name="user_name"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Your Email</label>
                    <input type="email"
                           name="user_email"
                           class="form-control">
                </div>
            </div>

            <button class="btn btn-primary w-100">
                Submit Complaint
            </button>

        </form>
    </div>
</div>


<script>
/* ===============================
   ANONYMOUS TOGGLE
================================= */
document.getElementById("anonymousCheck")
.addEventListener("change", function(){

    const section = document.getElementById("userDetails");

    if(this.checked){
        section.style.display = "none";
    } else {
        section.style.display = "block";
    }
});


/* ===============================
   GET LOCATION
================================= */
function getLocation(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
            function(position){
                document.getElementById("incidentLocation").value =
                    position.coords.latitude + ", " +
                    position.coords.longitude;
            },
            function(){
                alert("Location permission denied");
            }
        );
    } else {
        alert("Geolocation not supported");
    }
}


/* ===============================
   FORM SUBMIT
================================= */
document.getElementById("complaintForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const form = document.getElementById("complaintForm");
    const formData = new FormData(form);

    try {

        const response = await fetch(
            "http://localhost:3000/api/complaints",
            {
                method: "POST",
                body: formData
            }
        );

        const result = await response.json();

        alert("✅ Complaint Submitted Successfully!");
        form.reset();

    } catch (error) {
        console.error(error);
        alert("❌ Submission Failed");
    }

});
</script>

</body>
</html>
