<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h4">
                <i class="bi bi-shield-lock"></i> Admin Portal
            </span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </nav>

    <!-- STATS CARDS -->
    <div class="container mt-4">
        <div class="row g-4 text-center">

            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-warning">Pending</h6>
                        <h2 id="pendingCount" class="fw-bold">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-primary">Under Investigation</h6>
                        <h2 id="investigationCount" class="fw-bold">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-success">Resolved</h6>
                        <h2 id="resolvedCount" class="fw-bold">0</h2>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

    <div class="d-flex gap-2 align-items-center">

        <input type="text" id="searchInput" class="form-control"
               placeholder="Enter Complaint ID"
               style="max-width: 200px;">

        <button onclick="searchComplaint()" class="btn btn-primary">
            <i class="bi bi-search"></i> Search
        </button>

        <button onclick="loadComplaints()" class="btn btn-secondary">
            Reset
        </button>

    </div>

    <div>
        <label class="fw-bold me-2">Filter Status:</label>
        <select id="statusFilter" onchange="loadComplaints()" class="form-select d-inline-block w-auto">
            <option value="">All Statuses</option>
            <option value="Submitted">Submitted</option>
            <option value="Under Investigation">Under Investigation</option>
            <option value="Resolved">Resolved</option>
        </select>
    </div>

    <button onclick="downloadReport()" class="btn btn-success">
        <i class="bi bi-download"></i> Export CSV
    </button>

</div>


                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Priority</th>
                                <th>Submitted By</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="complaintsTableBody"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="admin.js"></script>

</body>
</html>
